services:
  db:
    image: postgres:15-alpine
    container_name: premierbyte-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-premierbyte}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-premierbyte}
      POSTGRES_DB: ${DB_DATABASE:-premierbyte_platform}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: premierbyte-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./apps/backend
      target: development
    container_name: premierbyte-backend
    restart: unless-stopped
    volumes:
      - ./apps/backend:/var/www
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-premierbyte_platform}
      DB_USERNAME: ${DB_USERNAME:-premierbyte}
      DB_PASSWORD: ${DB_PASSWORD:-premierbyte}
      REDIS_HOST: redis
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: premierbyte-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./apps/backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  frontend:
    build:
      context: ./apps/frontend
      target: development
    container_name: premierbyte-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - webserver

volumes:
  db-data:
  redis-data:
