name: CI Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-ci:
    name: Backend CI (Laravel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, gd
          coverage: none

      - name: Install Composer Dependencies
        run: |
          cd apps/backend
          composer install --prefer-dist --no-progress --non-interactive

      - name: Setup Local Env File
        run: |
          cd apps/backend
          cp .env.example .env
          php artisan key:generate

      - name: Run Pint Formatting Check
        run: |
          cd apps/backend
          vendor/bin/pint --test

      - name: Run PHPStan Static Analysis
        run: |
          cd apps/backend
          vendor/bin/phpstan analyse --ansi

      - name: Run PHPUnit Tests
        run: |
          cd apps/backend
          php artisan test

  frontend-ci:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install npm Dependencies
        run: |
          cd apps/frontend
          npm ci

      - name: Run Prettier Check
        run: |
          cd apps/frontend
          npm run format:check

      - name: Run ESLint Check
        run: |
          cd apps/frontend
          npm run lint

      - name: Run Vitest Unit Tests
        run: |
          cd apps/frontend
          npm run test

      - name: Run Next.js Build
        run: |
          cd apps/frontend
          npm run build
